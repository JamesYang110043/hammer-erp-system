[package]
name = "hammer-desktop"
description = "Hammer ERP 桌面程式（Tauri）"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "hammer-desktop"

[lib]
# `_lib` 後綴避免在 Windows 上與執行檔同名衝突（Tauri 範本的慣例）
name = "hammer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hammer-shared.workspace = true

# 預設的 `v1` feature：macOS Keychain、Windows 認證管理員、Linux Secret Service
keyring = "4"

reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri = { version = "2", features = [] }
tauri-specta = { version = "=2.0.0-rc.28", features = ["derive", "typescript"] }
thiserror.workspace = true
url = "2"

[dev-dependencies]
axum.workspace = true
time.workspace = true
tokio.workspace = true

[lints]
workspace = true
