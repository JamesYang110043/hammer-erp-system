# 桌面程式建置：在 macOS（Apple Silicon）與 Windows 執行 tauri build（architecture.md §11）
#
# 產出不簽章的安裝檔（簽章為待決事項 Q6），上傳為 workflow artifact，
# 可從 Actions 頁面該次執行的 Artifacts 區下載。
#
# 觸發時機（macOS runner 以 10 倍計費，所以 PR 不執行）：
# - push 到 main：只有動到桌面程式相關檔案時才建置
# - push tag（v*）：一律建置，用於發版
# - 手動觸發（Actions 頁面 → Desktop Build → Run workflow）：一律建置，可選任一分支

name: Desktop Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 每次執行都保留，不取消（main 的每個 commit 都要有建置結果）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # 只在 push 到 main 時判斷改動範圍；tag 與手動觸發不需要
  changes:
    name: changes
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # 桌面程式與它相依的 crate（architecture.md §4：desktop → shared, formula）
          filters: |
            desktop:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'apps/desktop/**'
              - 'crates/shared/**'
              - 'crates/formula/**'
              - '.github/workflows/desktop-build.yml'

  build:
    name: desktop-build (${{ matrix.name }})
    needs: changes
    # changes 被跳過（tag、手動觸發）時仍要執行，所以用 !failure() 取代預設的 success()
    if: >-
      !cancelled() && !failure() && (
        github.event_name == 'workflow_dispatch' ||
        github.ref_type == 'tag' ||
        needs.changes.outputs.desktop == 'true'
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            runner: macos-latest # Apple Silicon（arm64）
            artifact: hammer-erp-macos-arm64
            bundles: |
              target/release/bundle/dmg/*.dmg
          - name: windows
            runner: windows-latest
            artifact: hammer-erp-windows-x64
            bundles: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: pnpm install
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # beforeBuildCommand（pnpm build）會先建置前端
      - name: tauri build
        working-directory: apps/desktop
        run: pnpm tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
          retention-days: 14
