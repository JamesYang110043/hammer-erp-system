[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/formula",
    "crates/core",
    "crates/db",
    "crates/server",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

# 共用相依套件版本統一寫在這裡；各 crate 以 `xxx.workspace = true` 引用。
[workspace.dependencies]
hammer-shared = { path = "crates/shared" }
hammer-formula = { path = "crates/formula" }
hammer-core = { path = "crates/core" }
hammer-db = { path = "crates/db" }

anyhow = "1"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
dotenvy = "0.15"
getrandom = "0.3"
regex = "1"
rust_decimal = { version = "1", default-features = false, features = ["std", "serde"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# specta 2 仍是 RC 版，固定版本號，需與 tauri-specta 相容
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "=0.0.15"
# 不使用 default features（含 `any`）；只啟用 PostgreSQL 與專案用到的型別
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "json",
    "uuid",
    "rust_decimal",
    "time",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["catch-panic", "limit", "request-id", "trace", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "ansi"] }
http-body-util = "0.1"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
uuid = { version = "1", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# 非測試程式碼禁止 unwrap()；測試中允許（見 clippy.toml）
unwrap_used = "deny"

# Argon2 在 debug 建置下非常慢（單次雜湊可達數秒），開發與測試時也以最佳化編譯
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
